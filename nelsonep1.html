<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nelson IELTS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/bp-styles.css">
<style>
:root {font-size: 16px;}
html { scroll-behavior: smooth; }

body {
  font-family: 'inter', 'Noto Sans TC', system-ui;
  min-height: 100vh;
  padding: 18px;
}
</style>
</head>
<body class="bp-text-shell bp-bg-background">
	<div class="m-3">
		<h1>Lesson 1</h1>
		<div class="w-50">
			<practice-tracker
				data-prefix="ex-"
				data-title="自我檢測追蹤練習進度"
				data-panel-width="360px"
				data-cells-per-row="5"
				data-color-complete="teal"
				data-position="bottom-left"
				data-complete-text="全部完成！"
				data-complete-sub="繼續保持"
			></practice-tracker>
		</div>
	</div>
<section id="ex-01" class="p-3">
	<div class="container w-80">
		<div class="row">
			<div class="col">
				<week-cal id="mca-1" mode="icon" days="3" theme="aurora" locale="zh-TW"
				  target="#board-icon" show-header="false" highlight-today="false" default-first="false">
				  <wc-day date="2032/9/11" source-id="di1" icon="clock-history"   label="昨天"></wc-day>
				  <wc-day date="2032/9/12"  source-id="di2" icon="star"            label="下週一"></wc-day>
				  <wc-day date="2032/9/13"  source-id="di3" icon="slash-circle"    label="封鎖"></wc-day>
				</week-cal>
			</div>
			<div class="col-4">
				<div id="board-icon" class="board mt16"><div class="ph">← 點擊圖示格</div></div>
				<div id="di1">1</div>
				<div id="di2">2</div>
				<div id="di3">3</div>
			</div>
		</div>
	</div>
	<button class="btn btn-primary" onclick="handleDone('ex-01', this)">標記完成</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/bp-popnote.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/week-cal.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/practice-tracker.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/chunk-demo.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/dual-line.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/ui-table.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/ui-reading2.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/bp-stepper.js"></script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/ui-plus.js"></script>

<script>
  const allIds = ['ex-01','ex-02','ex-03','ex-04','ex-05','ex-06'];

  function handleDone(sectionId, btn) {
    if (win_PT()) win_PT().markDone(sectionId);
    const sec = document.getElementById(sectionId);
    if (sec) sec.classList.add('is-done');
    btn.disabled = true;
    btn.textContent = '✓ 已完成';
    showToast(sectionId + '  已標記完成');
  }

  function markAll() {
    allIds.forEach(id => {
      const btn = document.querySelector(`#${id} .btn-done`);
      if (btn && !btn.disabled) handleDone(id, btn);
    });
  }

  function resetAll() {
    location.reload();
  }

  function win_PT() { return window.PracticeTracker || null; }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
