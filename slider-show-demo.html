<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>slider-show 使用範例</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0C0D0C;
    color: #C6C7BD;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
  }

  /* ── 頂部標題列 ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: #111;
    border-bottom: 1px solid rgba(198,199,189,0.08);
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: #C8DD5A;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .topbar-subtitle {
    font-size: 0.75rem;
    color: rgba(198,199,189,0.4);
  }

  /* ── 分頁標籤 ── */
  .tabs {
    display: flex;
    gap: 3px;
    padding: 10px 20px 0;
    background: #0C0D0C;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(198,199,189,0.08);
  }
  .tab-btn {
    background: rgba(30,30,30,0.8);
    border: 1px solid rgba(198,199,189,0.1);
    border-bottom: none;
    color: rgba(198,199,189,0.5);
    padding: 7px 18px 8px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.18s;
    line-height: 1;
  }
  .tab-btn:hover { color: #C6C7BD; background: rgba(50,50,50,0.9); }
  .tab-btn.active {
    background: #161616;
    color: #C8DD5A;
    border-color: rgba(200,221,90,0.25);
  }
  .tab-badge {
    display: inline-block;
    font-size: 0.65rem;
    background: rgba(200,221,90,0.12);
    color: #C8DD5A;
    border-radius: 3px;
    padding: 1px 5px;
    margin-left: 6px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .tab-btn.active .tab-badge { background: rgba(200,221,90,0.22); }

  /* ── 主體 ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ── 程式碼面板 ── */
  .code-panel {
    background: #0e0e0e;
    border-right: 1px solid rgba(198,199,189,0.08);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .code-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #111;
    border-bottom: 1px solid rgba(198,199,189,0.06);
    flex-shrink: 0;
  }
  .code-panel-label {
    font-size: 0.68rem;
    color: rgba(198,199,189,0.35);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .example-desc {
    font-size: 0.72rem;
    color: rgba(198,199,189,0.5);
    max-width: 280px;
    text-align: right;
    line-height: 1.4;
  }
  .code-scroll {
    overflow-y: auto;
    flex: 1;
    padding: 18px 20px;
  }
  .code-scroll::-webkit-scrollbar { width: 6px; }
  .code-scroll::-webkit-scrollbar-track { background: transparent; }
  .code-scroll::-webkit-scrollbar-thumb { background: rgba(198,199,189,0.15); border-radius: 3px; }
  pre {
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 0.75rem;
    line-height: 1.8;
    white-space: pre;
    tab-size: 2;
  }

  /* ── 語法高亮 ── */
  .hl-tag   { color: #08A9D1; }
  .hl-attr  { color: #A0CF72; }
  .hl-val   { color: #C8DD5A; }
  .hl-cmt   { color: rgba(198,199,189,0.35); font-style: italic; }
  .hl-cls   { color: #C3A5E5; }
  .hl-txt   { color: #C6C7BD; }
  .hl-sp    { color: #EDA109; }

  /* ── 預覽面板 ── */
  .preview-panel {
    background: #141414;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .preview-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #111;
    border-bottom: 1px solid rgba(198,199,189,0.06);
    flex-shrink: 0;
  }
  .preview-panel-label {
    font-size: 0.68rem;
    color: rgba(198,199,189,0.35);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .preview-scroll {
    overflow-y: auto;
    flex: 1;
    padding: 20px;
  }
  .preview-scroll::-webkit-scrollbar { width: 6px; }
  .preview-scroll::-webkit-scrollbar-track { background: transparent; }
  .preview-scroll::-webkit-scrollbar-thumb { background: rgba(198,199,189,0.15); border-radius: 3px; }

  /* 特性標籤列 */
  .feature-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .ftag {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }
  .ftag-sky    { background: rgba(8,169,209,0.15);  color: #08A9D1; }
  .ftag-lime   { background: rgba(160,207,114,0.15); color: #A0CF72; }
  .ftag-lav    { background: rgba(195,165,229,0.15); color: #C3A5E5; }
  .ftag-yel    { background: rgba(222,202,75,0.15);  color: #DECA4B; }
  .ftag-safe   { background: rgba(64,201,154,0.15);  color: #40C99A; }
  .ftag-warn   { background: rgba(240,128,128,0.15); color: #F08080; }
  .ftag-ind    { background: rgba(123,108,240,0.15); color: #7B6CF0; }
  .ftag-org    { background: rgba(237,161,9,0.15);   color: #EDA109; }

  /* 屬性說明表 */
  .attr-table {
    margin-top: 14px;
    border-top: 1px solid rgba(198,199,189,0.08);
    padding-top: 12px;
  }
  .attr-row {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(198,199,189,0.04);
    font-size: 0.72rem;
    line-height: 1.5;
  }
  .attr-name {
    color: #A0CF72;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    min-width: 170px;
    flex-shrink: 0;
  }
  .attr-desc { color: rgba(198,199,189,0.65); }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">slider-show</span>
  <span class="topbar-subtitle">Web Component 使用範例 — 由淺入深</span>
</div>

<div class="tabs" id="tabs"></div>

<div class="main">
  <div class="code-panel">
    <div class="code-panel-header">
      <span class="code-panel-label">HTML 原始碼</span>
      <span class="example-desc" id="ex-desc"></span>
    </div>
    <div class="code-scroll">
      <pre id="code-display"></pre>
    </div>
  </div>

  <div class="preview-panel">
    <div class="preview-panel-header">
      <span class="preview-panel-label">即時預覽</span>
      <span style="font-size:0.68rem;color:rgba(198,199,189,0.35);">互動可操作</span>
    </div>
    <div class="preview-scroll">
      <div class="feature-tags" id="feature-tags"></div>
      <div id="preview-area"></div>
      <div class="attr-table" id="attr-table"></div>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     slider-show 元件核心程式
     ════════════════════════════════════════════ -->
<script>
class SliderShow extends HTMLElement {
  constructor() {
    super();
    this.currentPart = 1;
    this.currentSlideInPart = 0;
    this.partsData = {};
    this.isTransitioning = false;
    this.container = null;
  }

  static get observedAttributes() {
    return [
      'theme', 'height', 'current-part',
      'next-part-btn-text', 'prev-part-btn-text', 
      'finish-btn-text', 'restart-btn-text',
      'next-part-btn-position', 'show-part-indicator',
      'part-transition', 'auto-hide-nav', 'auto-show-part-buttons',
      'arrow-color', 'arrow-bg', 'dot-color', 'active-dot-color',
      'show-dots', 'show-arrows', 'loop', 'show-page-numbers',
      'update-header', 'update-title', 'header-template', 'title-template',
      'part-btn-color', 'part-btn-bg', 'part-btn-font-size', 
      'part-btn-padding', 'part-btn-border-radius',
      'show-finish', 'show-restart',
      'finish-btn-bg', 'finish-btn-color',
      'restart-btn-bg', 'restart-btn-color',
      'fontcolor-subtitle', 'fontcolor-main', 'fontcolor-footer',
      'extra-note-hover-color', 'extra-note-prefix', 'extra-note-postfix',
      'spoiler-mode', 'spoiler-text', 'spoiler-color',
      'quiz-require-complete',
      'keyboard-nav', 'keyboard-part-nav',
      'part-transition-duration', 'part-indicator-format',
      'filmstrip-label-format', 'filmstrip-thumb-size', 'filmstrip-show-holes',
      'slide-content-padding',
      'quiz-icon-correct', 'quiz-icon-incorrect',
      'quiz-correct-color', 'quiz-incorrect-color',
      'slide-content-bg', 'extra-note-content-bg',
      'quiz-blank-width',
      'show-progress', 'progress-color', 'progress-position', 'progress-height'
    ];
  }

  connectedCallback() {
    this.render();
    this.setupEventListeners();
    this.analyzeParts();
    this.setupExtraNotes();
    this.setupSpoilerMasks();
    this.setupQuizzes();
    setTimeout(() => { this.updateDisplay(); }, 0);
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (this.isConnected && oldValue !== newValue) {
      if (name === 'current-part') {
        this.currentPart = parseInt(newValue) || 1;
        this.currentSlideInPart = 0;
        this.updateDisplay();
      } else {
        this.render();
        this.setupEventListeners();
        this.analyzeParts();
        this.updateDisplay();
      }
    }
  }

  parseColor(colorValue) {
    if (!colorValue) return null;
    const brandColors = {
      'background': '#0C0D0C', 'fill': '#333333', 'shell': '#C6C7BD',
      'lavender': '#C3A5E5', 'special': '#C8DD5A', 'warning': '#F08080',
      'salmon': '#E5C3B3', 'sky': '#08A9D1', 'safe': '#40C99A',
      'vanilla': '#DBEDD8', 'yellow': '#DECA4B', 'focus': '#A0CF72',
      'info': '#4285EB', 'stone': '#95BDD7', 'indigo': '#7B6CF0',
      'pink': '#FFB3D9', 'orange': '#EDA109'
    };
    if (brandColors[colorValue.toLowerCase()]) return brandColors[colorValue.toLowerCase()];
    return colorValue;
  }

  getThemeColor() {
    let theme = this.getAttribute('theme') || SliderShow.defaults.theme;
    const isOutlineTheme = theme.endsWith('-outline');
    const baseTheme = isOutlineTheme ? theme.replace('-outline', '') : theme;
    return this.parseColor(baseTheme) || this.parseColor('shell');
  }

  getContrastColor(bgColor) {
    if (!bgColor) return '#e0e0e0';
    let color = this.parseColor(bgColor);
    color = color.replace('#', '');
    const r = parseInt(color.substr(0, 2), 16);
    const g = parseInt(color.substr(2, 2), 16);
    const b = parseInt(color.substr(4, 2), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.5 ? '#333333' : '#e0e0e0';
  }

  hexToRgba(hex, alpha) {
    if (!hex || !hex.startsWith('#')) return null;
    const h = hex.replace('#', '');
    const r = parseInt(h.substr(0, 2), 16);
    const g = parseInt(h.substr(2, 2), 16);
    const b = parseInt(h.substr(4, 2), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  _attr(name, fallback) {
    const val = this.getAttribute(name);
    if (val !== null) return val;
    const key = name.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    const def = SliderShow.defaults[key];
    if (def !== undefined) return String(def);
    return fallback !== undefined ? fallback : null;
  }

  _bool(name) {
    const val = this.getAttribute(name);
    if (val !== null) return val !== 'false';
    const key = name.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    return SliderShow.defaults[key] ?? false;
  }

  analyzeParts() {
    const allSlides = Array.from(this.querySelectorAll('[slide]'));
    this.partsData = {};
    allSlides.forEach(slide => {
      const part = parseInt(slide.getAttribute('part')) || 1;
      if (!this.partsData[part]) this.partsData[part] = [];
      this.partsData[part].push(slide);
    });
    allSlides.forEach(slide => { slide.style.display = 'none'; });
  }

  setupExtraNotes() {
    const globalPrefix = this.getAttribute('extra-note-prefix') || '';
    const globalPostfix = this.getAttribute('extra-note-postfix') || '';
    const extraNotes = this.querySelectorAll('extra-note');
    extraNotes.forEach(note => {
      const targetId = note.getAttribute('target');
      const source = note.getAttribute('source');
      const prefix = note.getAttribute('prefix') !== null ? note.getAttribute('prefix') : globalPrefix;
      const postfix = note.getAttribute('postfix') !== null ? note.getAttribute('postfix') : globalPostfix;
      if (!targetId || !source) { console.warn('extra-note 需要 target 和 source 屬性'); return; }
      const span = document.createElement('span');
      span.className = 'extra-note-trigger';
      span.style.display = 'inline';
      let prefixHTML = '';
      if (prefix) {
        const iconMatch = prefix.match(/bi-[\w-]+/);
        if (iconMatch) {
          const iconClass = iconMatch[0];
          const textBefore = prefix.substring(0, prefix.indexOf(iconClass));
          const textAfter = prefix.substring(prefix.indexOf(iconClass) + iconClass.length);
          prefixHTML = `${textBefore}<i class="bi ${iconClass}"></i>${textAfter}`;
        } else { prefixHTML = prefix; }
      }
      let content = note.innerHTML.trim();
      span.innerHTML = prefixHTML + content + postfix;
      span.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        const targetElement = document.getElementById(targetId);
        if (!targetElement) { console.warn(`找不到 id 為 ${targetId} 的元素`); return; }
        const sourceElement = document.getElementById(source);
        let cnt = sourceElement ? sourceElement.innerHTML : source;
        const contentDiv = document.createElement('div');
        contentDiv.className = 'extra-note-content';
        contentDiv.innerHTML = cnt;
        targetElement.innerHTML = '';
        targetElement.appendChild(contentDiv);
        setTimeout(() => { contentDiv.classList.add('show'); }, 10);
      });
      note.parentNode.replaceChild(span, note);
    });
  }

  setupSpoilerMasks() {
    const spoilerMode = this.getAttribute('spoiler-mode');
    const globalSpoilerText = this.getAttribute('spoiler-text') || '點擊查看內容';
    const spoilerColor = this.parseColor(this.getAttribute('spoiler-color')) || this.getThemeColor();
    if (spoilerMode === 'true' || spoilerMode === 'full') {
      Array.from(this.querySelectorAll('[slide]')).forEach(slide => {
        this.applySpoilerMask(slide, globalSpoilerText, spoilerColor);
      });
    }
    this.querySelectorAll('[spoiler]').forEach(div => {
      const customText = div.getAttribute('spoiler') || globalSpoilerText;
      this.applySpoilerMask(div, customText, spoilerColor);
    });
  }

  applySpoilerMask(element, text, color) {
    if (element.classList.contains('spoiler-masked')) return;
    element.classList.add('spoiler-masked');
    element.style.position = 'relative';
    const mask = document.createElement('div');
    mask.className = 'spoiler-mask';
    Object.assign(mask.style, {
      position:'absolute', top:'0', left:'0', width:'100%', height:'100%',
      backgroundColor: color, display:'flex', alignItems:'center',
      justifyContent:'center', cursor:'pointer', zIndex:'100',
      transition:'opacity 0.3s ease', borderRadius:'8px'
    });
    const tc = document.createElement('div');
    Object.assign(tc.style, {
      textAlign:'center', padding:'20px', color: this.getContrastColor(color),
      fontSize:'1.2rem', fontWeight:'500', lineHeight:'1.6',
      display:'flex', alignItems:'center', justifyContent:'center', height:'100%'
    });
    tc.innerHTML = text;
    mask.appendChild(tc);
    mask.addEventListener('click', (e) => {
      e.stopPropagation();
      mask.style.opacity = '0';
      setTimeout(() => { mask.remove(); element.classList.remove('spoiler-masked'); }, 300);
    });
    element.appendChild(mask);
  }

  setupQuizzes() {
    this.querySelectorAll('quiz').forEach((quiz, quizIndex) => {
      const originalText = quiz.textContent;
      const quizId = `quiz-${Date.now()}-${quizIndex}`;
      const pattern = /\{\{([^}]+)\}\}/g;
      const answers = [];
      let match;
      while ((match = pattern.exec(originalText)) !== null) answers.push(match[1].trim());
      if (answers.length === 0) return;
      const container = document.createElement('span');
      container.className = 'quiz-container';
      const customClass = quiz.getAttribute('classname');
      if (customClass) container.className += ' ' + customClass;
      container.dataset.quizId = quizId;
      container.dataset.answers = JSON.stringify(answers);
      let html = originalText;
      let blankIndex = 0;
      html = html.replace(/\{\{([^}]+)\}\}/g, () => {
        const blank = `<span class="quiz-blank" contenteditable="true" data-blank-index="${blankIndex}" spellcheck="false"></span>`;
        blankIndex++;
        return blank;
      });
      container.innerHTML = html;
      container.querySelectorAll('.quiz-blank').forEach(blank => {
        blank.addEventListener('input', () => { this.checkQuizCompletion(); });
        blank.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const nextBlank = blank.nextElementSibling?.classList.contains('quiz-blank')
              ? blank.nextElementSibling
              : container.querySelector('.quiz-blank:not([data-filled])');
            if (nextBlank) nextBlank.focus();
          }
        });
      });
      quiz.parentNode.replaceChild(container, quiz);
    });
    this.checkQuizCompletion();
  }

  checkQuizCompletion() {
    const requireComplete = this.getAttribute('quiz-require-complete') !== 'false';
    if (!requireComplete) { this.enableNavigation(); return true; }
    const currentSlides = this.getCurrentPartSlides();
    if (currentSlides.length === 0) return true;
    const currentSlide = currentSlides[this.currentSlideInPart];
    if (!currentSlide) return true;
    const quizContainers = currentSlide.querySelectorAll('.quiz-container');
    if (quizContainers.length === 0) { this.enableNavigation(); return true; }
    let allFilled = true;
    quizContainers.forEach(container => {
      container.querySelectorAll('.quiz-blank').forEach(blank => {
        if (blank.textContent.trim() === '') allFilled = false;
      });
    });
    if (allFilled) this.enableNavigation(); else this.disableNavigation();
    return allFilled;
  }

  disableNavigation() {
    const nextBtn = this.container?.querySelector('.next-btn');
    const nextPartBtn = this.container?.querySelector('.next-part-btn');
    if (nextBtn) nextBtn.disabled = true;
    if (nextPartBtn) nextPartBtn.disabled = true;
  }

  enableNavigation() {
    const nextBtn = this.container?.querySelector('.next-btn');
    const nextPartBtn = this.container?.querySelector('.next-part-btn');
    if (nextBtn) nextBtn.disabled = false;
    if (nextPartBtn) nextPartBtn.disabled = false;
  }

  showQuizResults(previousSlide) {
    const quizContainers = previousSlide.querySelectorAll('.quiz-container');
    if (quizContainers.length === 0) return null;
    const results = [];
    quizContainers.forEach(container => {
      const answers = JSON.parse(container.dataset.answers);
      const blanks = container.querySelectorAll('.quiz-blank');
      const userAnswers = Array.from(blanks).map(blank => blank.textContent.trim());
      results.push(answers.map((correctAnswer, index) => {
        const userAnswer = userAnswers[index] || '';
        const isCorrect = userAnswer.toLowerCase() === correctAnswer.toLowerCase();
        return { correctAnswer, userAnswer, isCorrect };
      }));
    });
    return results;
  }

  getTotalParts() { return Object.keys(this.partsData).length; }

  getGlobalSlideIndex() {
    let globalIndex = 0;
    const allParts = Object.keys(this.partsData).sort((a, b) => parseInt(a) - parseInt(b));
    for (const part of allParts) {
      const partNum = parseInt(part);
      if (partNum < this.currentPart) globalIndex += this.partsData[part].length;
      else if (partNum === this.currentPart) { globalIndex += this.currentSlideInPart; break; }
    }
    return globalIndex;
  }

  jumpToGlobalSlide(globalIndex) {
    let currentIndex = 0;
    const allParts = Object.keys(this.partsData).sort((a, b) => parseInt(a) - parseInt(b));
    for (const part of allParts) {
      const partNum = parseInt(part);
      const slidesInPart = this.partsData[part].length;
      if (globalIndex < currentIndex + slidesInPart) {
        this.currentPart = partNum;
        this.currentSlideInPart = globalIndex - currentIndex;
        this.updateDisplay();
        return;
      }
      currentIndex += slidesInPart;
    }
  }

  getCurrentPartSlides() { return this.partsData[this.currentPart] || []; }
  isLastSlideInPart() { return this.currentSlideInPart >= this.getCurrentPartSlides().length - 1; }
  isFirstSlideInPart() { return this.currentSlideInPart === 0; }
  isLastPart() { return this.currentPart >= this.getTotalParts(); }
  isFirstPart() { return this.currentPart === 1; }

  prevSlide() {
    if (this.isTransitioning) return;
    const loop = this.getAttribute('loop') === 'true';
    if (this.currentSlideInPart > 0) { this.currentSlideInPart--; this.updateDisplay(); }
    else if (loop) { this.currentSlideInPart = this.getCurrentPartSlides().length - 1; this.updateDisplay(); }
  }

  nextSlide() {
    if (this.isTransitioning) return;
    const loop = this.getAttribute('loop') === 'true';
    if (this.currentSlideInPart < this.getCurrentPartSlides().length - 1) { this.currentSlideInPart++; this.updateDisplay(); }
    else if (loop) { this.currentSlideInPart = 0; this.updateDisplay(); }
  }

  nextPart() {
    if (this.isTransitioning) return;
    if (this.currentPart < this.getTotalParts()) {
      this.isTransitioning = true;
      const transition = this.getAttribute('part-transition') || 'slide';
      this.applyTransition(transition, 'out', () => {
        this.currentPart++; this.currentSlideInPart = 0; this.updateDisplay();
        this.applyTransition(transition, 'in', () => { this.isTransitioning = false; });
        this.dispatchEvent(new CustomEvent('part-changed', { detail: { part: this.currentPart, total: this.getTotalParts() } }));
      });
    }
  }

  prevPart() {
    if (this.isTransitioning) return;
    if (this.currentPart > 1) {
      this.isTransitioning = true;
      const transition = this.getAttribute('part-transition') || 'slide';
      this.applyTransition(transition, 'out', () => {
        this.currentPart--; this.currentSlideInPart = 0; this.updateDisplay();
        this.applyTransition(transition, 'in', () => { this.isTransitioning = false; });
        this.dispatchEvent(new CustomEvent('part-changed', { detail: { part: this.currentPart, total: this.getTotalParts() } }));
      });
    }
  }

  restart() {
    if (this.isTransitioning) return;
    this.isTransitioning = true;
    const transition = this.getAttribute('part-transition') || 'slide';
    this.applyTransition(transition, 'out', () => {
      this.currentPart = 1; this.currentSlideInPart = 0; this.updateDisplay();
      this.applyTransition(transition, 'in', () => { this.isTransitioning = false; });
      this.dispatchEvent(new CustomEvent('restarted', { detail: { part: this.currentPart } }));
    });
  }

  applyTransition(type, direction, callback) {
    const container = this.container?.querySelector('.slides-container');
    if (!container) { callback(); return; }
    const duration = parseInt(this.getAttribute('part-transition-duration')) || 500;
    container.style.transition = 'none';
    if (type === 'fade') {
      if (direction === 'out') {
        container.style.opacity = '1';
        setTimeout(() => { container.style.transition = `opacity ${duration}ms ease-out`; container.style.opacity = '0'; setTimeout(callback, duration); }, 10);
      } else {
        container.style.opacity = '0';
        setTimeout(() => { container.style.transition = `opacity ${duration}ms ease-in`; container.style.opacity = '1'; setTimeout(callback, duration); }, 10);
      }
    } else if (type === 'slide') {
      if (direction === 'out') { container.classList.add('slide-out'); setTimeout(() => { container.classList.remove('slide-out'); callback(); }, duration); }
      else { container.classList.add('slide-in'); setTimeout(() => { container.classList.remove('slide-in'); callback(); }, duration); }
    } else { callback(); }
  }

  updateDisplay() {
    const slides = this.getCurrentPartSlides();
    if (this.currentSlideInPart > 0) {
      const prevSlide = slides[this.currentSlideInPart - 1];
      const currSlide = slides[this.currentSlideInPart];
      if (prevSlide && currSlide) {
        const quizResults = this.showQuizResults(prevSlide);
        if (quizResults && quizResults.length > 0) {
          let rc = currSlide.querySelector('.quiz-results-auto');
          if (!rc) { rc = document.createElement('div'); rc.className = 'quiz-results-auto'; currSlide.insertBefore(rc, currSlide.firstChild); }
          const getIconHTML = (val, fb) => { if (!val) return fb; if (/^bi-[\w-]+$/.test(val.trim())) return `<i class="bi ${val.trim()}"></i>`; return val; };
          const correctIconHTML = getIconHTML(this.getAttribute('quiz-icon-correct'), '✓');
          const incorrectIconHTML = getIconHTML(this.getAttribute('quiz-icon-incorrect'), '✗');
          let resultsHTML = '';
          quizResults.forEach(quizResult => {
            resultsHTML += '<div class="quiz-result-group">';
            quizResult.forEach((item, index) => {
              const statusIcon = item.isCorrect ? correctIconHTML : incorrectIconHTML;
              const statusClass = item.isCorrect ? 'correct' : 'incorrect';
              resultsHTML += `<div class="quiz-result-item ${statusClass}"><span class="quiz-result-icon">${statusIcon}</span><span class="quiz-result-label">第 ${index + 1} 空：</span><span class="quiz-result-user">你的答案：<strong>${item.userAnswer || '(未填)'}</strong></span><span class="quiz-result-correct">正確答案：<strong>${item.correctAnswer}</strong></span></div>`;
            });
            resultsHTML += '</div>';
          });
          rc.innerHTML = resultsHTML;
        }
      }
    }
    Array.from(this.querySelectorAll('[slide]')).forEach(s => { s.style.display = 'none'; });
    slides.forEach((slide, index) => { slide.style.display = index === this.currentSlideInPart ? 'block' : 'none'; });

    const dotsContainer = this.container?.querySelector('.dots-container');
    if (dotsContainer) {
      dotsContainer.innerHTML = '';
      slides.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === this.currentSlideInPart ? 'active' : ''}`;
        dot.addEventListener('click', () => { this.currentSlideInPart = index; this.updateDisplay(); });
        dotsContainer.appendChild(dot);
      });
    }

    const pageNumbersContainer = this.container?.querySelector('.page-numbers-container');
    const showPageNumbers = this.getAttribute('show-page-numbers') === 'true';
    if (pageNumbersContainer && showPageNumbers) {
      pageNumbersContainer.innerHTML = '';
      const allPartKeys = Object.keys(this.partsData).sort((a, b) => parseInt(a) - parseInt(b));
      allPartKeys.forEach(partKey => {
        const partNum = parseInt(partKey);
        const slidesInPart = this.partsData[partKey];
        const isActivePart = partNum === this.currentPart;
        let partStartGlobal = 0;
        for (const pk of allPartKeys) { if (parseInt(pk) < partNum) partStartGlobal += this.partsData[pk].length; }
        const labelList = (this.getAttribute('filmstrip-label-format') || '').split(',').map(s => s.trim()).filter(Boolean);
        const partLabel_text = labelList[partNum - 1] || `P${partNum}`;
        const partGroup = document.createElement('div');
        partGroup.className = `part-group${isActivePart ? ' active-part' : ''}`;
        const partLabel = document.createElement('div');
        partLabel.className = 'part-group-label';
        partLabel.textContent = partLabel_text;
        partGroup.appendChild(partLabel);
        const slidesRow = document.createElement('div');
        slidesRow.className = 'part-group-slides';
        slidesInPart.forEach((_, slideIndex) => {
          const isActiveSlide = isActivePart && slideIndex === this.currentSlideInPart;
          const globalIndex = partStartGlobal + slideIndex;
          const thumb = document.createElement('button');
          thumb.className = `film-strip-thumb${isActiveSlide ? ' active' : ''}`;
          thumb.textContent = slideIndex + 1;
          thumb.title = `Part ${partNum}・第 ${slideIndex + 1} 張`;
          thumb.addEventListener('click', () => { this.jumpToGlobalSlide(globalIndex); });
          slidesRow.appendChild(thumb);
        });
        partGroup.appendChild(slidesRow);
        pageNumbersContainer.appendChild(partGroup);
      });
      pageNumbersContainer.style.display = 'flex';
    } else if (pageNumbersContainer) {
      pageNumbersContainer.style.display = 'none';
    }

    const partIndicator = this.container?.querySelector('.part-indicator');
    const showPartIndicator = this.getAttribute('show-part-indicator') !== 'false';
    if (partIndicator && showPartIndicator) {
      const indicatorFormat = this.getAttribute('part-indicator-format') || 'Part {part} / {total}';
      partIndicator.textContent = indicatorFormat.replace('{part}', this.currentPart).replace('{total}', this.getTotalParts()).replace('{slide}', this.currentSlideInPart + 1).replace('{part-slides}', slides.length);
      partIndicator.style.display = 'block';
    } else if (partIndicator) { partIndicator.style.display = 'none'; }

    const autoShowPartButtons = this.getAttribute('auto-show-part-buttons') === 'true';
    const showFinish = this.getAttribute('show-finish') !== 'false';
    const showRestart = this.getAttribute('show-restart') !== 'false';
    const nextPartBtn = this.container?.querySelector('.next-part-btn');
    const prevPartBtn = this.container?.querySelector('.prev-part-btn');
    const finishBtn = this.container?.querySelector('.finish-btn');
    const restartBtn = this.container?.querySelector('.restart-btn');
    if (nextPartBtn && prevPartBtn && finishBtn && restartBtn) {
      if (autoShowPartButtons) {
        if (this.isLastSlideInPart()) {
          if (this.isLastPart()) { nextPartBtn.style.display = 'none'; if (showFinish) finishBtn.style.display = 'flex'; }
          else { nextPartBtn.style.display = 'flex'; finishBtn.style.display = 'none'; }
        } else { nextPartBtn.style.display = 'none'; finishBtn.style.display = 'none'; }
        prevPartBtn.style.display = (this.isFirstSlideInPart() && !this.isFirstPart()) ? 'flex' : 'none';
        restartBtn.style.display = (this.isLastPart() && this.isLastSlideInPart() && showRestart) ? 'flex' : 'none';
      } else {
        nextPartBtn.style.display = prevPartBtn.style.display = finishBtn.style.display = restartBtn.style.display = 'none';
      }
    }

    const prevBtn = this.container?.querySelector('.prev-btn');
    const nextBtn = this.container?.querySelector('.next-btn');
    if (prevBtn && nextBtn) {
      const loop = this.getAttribute('loop') === 'true';
      prevBtn.disabled = !loop && this.currentSlideInPart === 0;
      nextBtn.disabled = !loop && this.isLastSlideInPart();
    }

    const progressTrack = this.container?.querySelector('.progress-bar-track');
    if (progressTrack) {
      const allPartKeys = Object.keys(this.partsData).sort((a, b) => parseInt(a) - parseInt(b));
      const totalSlides = allPartKeys.reduce((sum, k) => sum + this.partsData[k].length, 0);
      const globalIndex = this.getGlobalSlideIndex();
      const pct = totalSlides > 1 ? ((globalIndex + 1) / totalSlides) * 100 : 100;
      const fill = progressTrack.querySelector('.progress-bar-fill');
      if (fill) fill.style.width = `${pct}%`;
    }

    this.checkQuizCompletion();
  }

  setupEventListeners() {
    const prevBtn = this.container?.querySelector('.prev-btn');
    const nextBtn = this.container?.querySelector('.next-btn');
    const nextPartBtn = this.container?.querySelector('.next-part-btn');
    const prevPartBtn = this.container?.querySelector('.prev-part-btn');
    const finishBtn = this.container?.querySelector('.finish-btn');
    const restartBtn = this.container?.querySelector('.restart-btn');
    if (prevBtn) prevBtn.addEventListener('click', () => this.prevSlide());
    if (nextBtn) nextBtn.addEventListener('click', () => this.nextSlide());
    if (nextPartBtn) nextPartBtn.addEventListener('click', () => this.nextPart());
    if (prevPartBtn) prevPartBtn.addEventListener('click', () => this.prevPart());
    if (restartBtn) restartBtn.addEventListener('click', () => this.restart());
    if (finishBtn) finishBtn.addEventListener('click', () => { this.dispatchEvent(new CustomEvent('finished', { detail: { part: this.currentPart, total: this.getTotalParts() } })); });
    this._keyHandler = (e) => {
      if (this.getAttribute('keyboard-nav') === 'false') return;
      if (e.key === 'ArrowLeft') this.prevSlide();
      if (e.key === 'ArrowRight') this.nextSlide();
      if (this.getAttribute('keyboard-part-nav') === 'true') {
        if (e.key === 'PageUp') { e.preventDefault(); this.prevPart(); }
        if (e.key === 'PageDown') { e.preventDefault(); this.nextPart(); }
      }
    };
    document.addEventListener('keydown', this._keyHandler);
  }

  disconnectedCallback() {
    if (this._keyHandler) document.removeEventListener('keydown', this._keyHandler);
  }

    const slides = Array.from(this.querySelectorAll('[slide]'));
    this.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'slider-wrapper';
    wrapper.style.height = height;
    const partIndicator = document.createElement('div');
    partIndicator.className = 'part-indicator';
    wrapper.appendChild(partIndicator);
    const progressTrack = document.createElement('div');
    progressTrack.className = ['progress-bar-track', `position-${progressPosition}`, showProgress ? 'show' : ''].filter(Boolean).join(' ');
    const progressFill = document.createElement('div');
    progressFill.className = 'progress-bar-fill';
    progressTrack.appendChild(progressFill);
    wrapper.appendChild(progressTrack);
    const slidesContainer = document.createElement('div');
    slidesContainer.className = 'slides-container';
    slides.forEach(slide => { slidesContainer.appendChild(slide); });
    wrapper.appendChild(slidesContainer);
    this.appendChild(wrapper);
    const pageNumbersContainer = document.createElement('div');
    pageNumbersContainer.className = 'page-numbers-container';
    this.appendChild(pageNumbersContainer);
    const controls = document.createElement('div');
    controls.className = 'controls';
    controls.innerHTML = `<button class="prev-btn">◀</button><div class="dots-container"></div><button class="next-btn">▶</button>`;
    this.appendChild(controls);
    const partButtons = document.createElement('div');
    partButtons.className = 'part-buttons';
    partButtons.innerHTML = `<button class="prev-part-btn">${prevPartBtnText}</button><button class="next-part-btn">${nextPartBtnText}</button><button class="finish-btn">${finishBtnText}</button><button class="restart-btn">${restartBtnText}</button>`;
    this.appendChild(partButtons);
    this.container = this;
  }
}

      </div>
    </div>
  </div>
</slider-show>`
  }
];

/* ── 語法高亮（單次掃描，避免二次比對污染注入的 span）── */
function highlight(raw) {
  // Step 1：跳脫 HTML 實體
  const esc = raw
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Step 2：一次性比對 comment 或完整 tag，在 callback 內一次處理完
  // ・comment : &lt;!-- ... --&gt;
  // ・tag     : &lt; /?  tagName  attrs  /?&gt;
  //
  // attrs 子字串在 callback 拿到時完全沒有 <span>，
  // 因此對 attrs 做的二次 replace 不會汙染到已注入的標記。
  return esc.replace(
    /(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([A-Za-z][\w\-.]*)((?:\s+[\w\-.:]+(?:="[^"]*")?)*)((?:\s*\/)?)(&gt;)/g,
    (_, comment, open, tagName, attrs, selfClose, close) => {
      // HTML 注釋
      if (comment) return `<span class="hl-cmt">${comment}</span>`;

      // 對 attrs 子字串著色（此處為純文字，無任何 span 標籤）
      const styledAttrs = attrs.replace(
        /(\s+)([\w\-.:]+)(="([^"]*)")?/g,
        (m, space, name, eqVal, val) =>
          eqVal !== undefined
            ? `${space}<span class="hl-attr">${name}</span>="<span class="hl-val">${val}</span>"`
            : `${space}<span class="hl-attr">${name}</span>`
      );

      return `${open}<span class="hl-tag">${tagName}</span>${styledAttrs}${selfClose}${close}`;
    }
  );
}

/* ── 切換範例 ── */
let currentKey = null;

function showExample(key) {
  if (key === currentKey) return;
  currentKey = key;

  const ex = EXAMPLES.find(e => e.id === key);

  // 更新 tab 狀態
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === key);
  });

  // 更新描述
  document.getElementById('ex-desc').textContent = ex.desc;

  // 更新程式碼顯示
  document.getElementById('code-display').innerHTML = highlight(ex.html);

  // 更新特性標籤
  const ftEl = document.getElementById('feature-tags');
  ftEl.innerHTML = ex.features
    .map(f => `<span class="ftag ${f.cls}">${f.text}</span>`)
    .join('');

  // 更新屬性說明
  const atEl = document.getElementById('attr-table');
  atEl.innerHTML = ex.attrs.map(a =>
    `<div class="attr-row">
      <span class="attr-name">${a.name}</span>
      <span class="attr-desc">${a.desc}</span>
    </div>`
  ).join('');

  // 更新即時預覽（innerHTML 觸發 connectedCallback）
  const preview = document.getElementById('preview-area');
  preview.innerHTML = ex.html;
}

/* ── 建立 tab 按鈕 ── */
const tabsEl = document.getElementById('tabs');
EXAMPLES.forEach(ex => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn';
  btn.dataset.key = ex.id;
  btn.innerHTML = `${ex.label} <span class="tab-badge">${ex.badge}</span>`;
  btn.addEventListener('click', () => showExample(ex.id));
  tabsEl.appendChild(btn);
});

// 預設顯示第一個
showExample('lv1');
</script>
