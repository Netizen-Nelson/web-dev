<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌色票</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0C0D0C;
    --shell:    #C6C7BD;
    --lavender: #C3A5E5;
    --sky:      #95C9DE;
    --warning:  #E6374B;
    --salmon:   #E5C3B3;
    --ocean:    #1CCAE8;
    --safe:     #299459;
    --teal:     #0DA591;
    --vanilla:  #DBEDD8;
    --yellow:   #E3D322;
    --focus:    #3C7BCF;
    --special:  #B3DE73;
    --info:     #2351DB;
    --indigo:   #7849C9;
    --pink:     #FF91D7;
    --orange:   #EDA109;
  }

  body {
    background: var(--bg);
    color: var(--shell);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 1.2rem;
    line-height: 1.4;
    padding: 48px 60px;
    min-height: 100vh;
  }

  header {
    margin-bottom: 48px;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--shell);
    letter-spacing: 0.04em;
  }

  header p {
    margin-top: 8px;
    color: rgba(198,199,189,0.82);
    font-size: 1rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }

  .swatch {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(198,199,189,0.12);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
  }

  .swatch:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .swatch__block {
    height: 140px;
    width: 100%;
    display: flex;
    align-items: flex-end;
    padding: 12px 16px;
  }

  .swatch__label-inline {
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .swatch__meta {
    background: rgba(12,13,12,0.72);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .swatch__name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--shell);
  }

  .swatch__hex {
    font-size: 0.9rem;
    font-family: 'Consolas', 'Courier New', monospace;
    color: rgba(198,199,189,0.78);
    letter-spacing: 0.05em;
  }

  .copy-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(12,13,12,0.85);
    color: var(--shell);
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .swatch.copied .copy-badge {
    opacity: 1;
  }

  /* Dark-label colors need light text on the block */
  .light-text .swatch__label-inline { color: rgba(255,255,255,0.88); }
  .dark-text  .swatch__label-inline { color: rgba(12,13,12,0.76); }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--teal);
    color: #fff;
    padding: 10px 28px;
    border-radius: 40px;
    font-size: 0.95rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>品牌色票</h1>
  <p>點擊色塊即可複製 HEX 值</p>
</header>

<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<script>
const colors = [
  { name: "dark",     label: "底層背景",  hex: "#0C0D0C", light: true  },
  { name: "shell",    label: "Shell",     hex: "#C6C7BD", light: false },
  { name: "lavender", label: "Lavender",  hex: "#C3A5E5", light: false },
  { name: "sky",      label: "Sky",       hex: "#95C9DE", light: false },
  { name: "warning",  label: "Warning",   hex: "#E6374B", light: true  },
  { name: "salmon",   label: "Salmon",    hex: "#E5C3B3", light: false },
  { name: "ocean",    label: "Ocean",     hex: "#1CCAE8", light: false },
  { name: "safe",     label: "Safe",      hex: "#299459", light: true  },
  { name: "teal",     label: "Teal",      hex: "#0DA591", light: true  },
  { name: "vanilla",  label: "Vanilla",   hex: "#DBEDD8", light: false },
  { name: "yellow",   label: "Yellow",    hex: "#E3D322", light: false },
  { name: "focus",    label: "Focus",     hex: "#3C7BCF", light: true  },
  { name: "special",  label: "Special",   hex: "#B3DE73", light: false },
  { name: "info",     label: "Info",      hex: "#2351DB", light: true  },
  { name: "indigo",   label: "Indigo",    hex: "#7849C9", light: true  },
  { name: "pink",     label: "Pink",      hex: "#FF91D7", light: false },
  { name: "orange",   label: "Orange",    hex: "#EDA109", light: false },
];

const grid = document.getElementById('grid');
const toast = document.getElementById('toast');
let toastTimer;

colors.forEach(c => {
  const card = document.createElement('div');
  card.className = `swatch ${c.light ? 'light-text' : 'dark-text'}`;
  card.innerHTML = `
    <div class="swatch__block" style="background:${c.hex};">
      <span class="swatch__label-inline">${c.name}</span>
    </div>
    <div class="swatch__meta">
      <span class="swatch__name">${c.label}</span>
      <span class="swatch__hex">${c.hex}</span>
    </div>
    <div class="copy-badge">已複製！</div>
  `;

  card.addEventListener('click', () => {
    navigator.clipboard.writeText(c.hex).then(() => {
      card.classList.add('copied');
      setTimeout(() => card.classList.remove('copied'), 1200);

      clearTimeout(toastTimer);
      toast.textContent = `已複製 ${c.hex}（${c.label}）`;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    });
  });

  grid.appendChild(card);
});
</script>
</body>
</html>
