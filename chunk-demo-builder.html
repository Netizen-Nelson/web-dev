<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chunk Demo 編輯器 — Nelson English</title>
<script>
/* 在 CDN 版本載入前覆蓋品牌色，含新增的 vanilla 和 focus */
window.ChunkDemoConfig = {
  themes: {
    vanilla: { border: '#DBEDD8', text: '#DBEDD8', bg: 'rgba(219,237,216,.09)' },
    focus:   { border: '#A0CF72', text: '#A0CF72', bg: 'rgba(160,207,114,.09)' },
  }
};
</script>
<script src="https://cdn.jsdelivr.net/gh/netizen-nelson/web-dev/chunk-demo.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
:root { font-size: 18px; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: #0C0D0C;
  color: #C6C7BD;
  font-family: 'Inter','Noto Sans TC',sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.app-header {
  height: 48px;
  background: #161716;
  border-bottom: 1px solid #242424;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 1040;
}
.app-logo  { color: #C8DD5A; font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
.app-note  { color: #444; font-size: 0.75rem; }
.btn-open  {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px; background: #C8DD5A; border: none; border-radius: 5px;
  color: #0C0D0C; font-size: 0.82rem; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: opacity .2s;
}
.btn-open:hover { opacity: .85; }
.header-tabs { display: flex; margin-left: auto; gap: 4px; }
.header-tab {
  padding: 5px 16px; background: transparent;
  border: 1px solid #2a2a2a; border-radius: 5px; color: #555;
  cursor: pointer; font-size: 0.82rem; transition: all .15s;
}
.header-tab.active { border-color: #C8DD5A; color: #C8DD5A; background: #1a1a0a; }
.header-tab:hover:not(.active) { color: #C6C7BD; border-color: #3a3a3a; }

/* ── Main ────────────────────────────────────────────────────────────────── */
.main-content { flex: 1; overflow-y: auto; padding: 28px; }
.content-wrap { max-width: 860px; margin: 0 auto; }
.preview-shell {
  background: #0e0f0e;
  border: 1px solid #1e1e1e;
  border-radius: 10px;
  padding: 28px 24px;
}
.preview-empty {
  color: #333; text-align: center; padding: 60px 20px; font-size: 0.9rem;
}
.code-area    { max-width: 960px; margin: 0 auto; }
.code-textarea {
  width: 100%; background: #0C0D0C; border: 1px solid #2a2a2a; border-radius: 6px;
  color: #C8DD5A; font-family: 'Consolas','Monaco',monospace;
  font-size: 0.76rem; padding: 14px; resize: vertical; outline: none; line-height: 1.6;
}
.copy-row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; }
.copy-toast { font-size: 0.78rem; color: #40C99A; display: none; }

/* ── Offcanvas ───────────────────────────────────────────────────────────── */
#builderOffcanvas {
  width: 480px !important;
  background: #161716;
  border-right: 1px solid #242424;
}
.offcanvas-header {
  background: #1e1f1e; border-bottom: 1px solid #242424; padding: 13px 18px;
}
.offcanvas-title { color: #C8DD5A; font-size: 0.9rem; font-weight: 700; }
.offcanvas-body  { padding: 0; }
.btn-close-ne {
  background: transparent; border: none; color: #555; font-size: 1.1rem;
  cursor: pointer; padding: 2px 6px; transition: color .15s;
}
.btn-close-ne:hover { color: #C6C7BD; }

/* ── 區塊 ────────────────────────────────────────────────────────────────── */
.sec { padding: 16px 18px; border-bottom: 1px solid #1e1e1e; }
.sec-title {
  font-size: 0.68rem; font-weight: 700; color: #C8DD5A;
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px;
}

/* ── 表單 ────────────────────────────────────────────────────────────────── */
.fl  { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.fl label { font-size: 0.75rem; color: #95BDD7; }
.ne-in {
  width: 100%; background: #0C0D0C; border: 1px solid #333; border-radius: 5px;
  color: #C6C7BD; padding: 6px 10px; font-size: 0.85rem; outline: none;
  font-family: inherit; transition: border-color .2s;
}
.ne-in:focus { border-color: #40C99A; }
textarea.ne-in { resize: vertical; }
.hint-sm { font-size: 0.7rem; color: #444; margin-top: -2px; }
.fl-row  { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }

/* ── 主題選擇器 ──────────────────────────────────────────────────────────── */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin-bottom: 4px;
}
.theme-sw {
  padding: 5px 0; border: 1.5px solid var(--tc); border-radius: 5px;
  background: transparent; color: var(--tc);
  font-size: 0.62rem; font-weight: 700; cursor: pointer;
  text-align: center; transition: all .15s;
}
.theme-sw:hover  { opacity: .85; }
.theme-sw.active { background: var(--tc); color: #0C0D0C; }

/* ── 語塊清單 ────────────────────────────────────────────────────────────── */
.chunk-item {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 10px; background: #0C0D0C;
  border: 1px solid #2a2a2a; border-radius: 6px; margin-bottom: 6px; font-size: 0.82rem;
}
.chunk-id    { color: #C8DD5A; font-weight: 700; flex-shrink: 0; font-family: monospace; }
.chunk-icon  { flex-shrink: 0; font-size: 1rem; }
.chunk-label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #95BDD7; }
.chunk-actions { display: flex; gap: 3px; flex-shrink: 0; }
.la-btn {
  background: transparent; border: 1px solid #2a2a2a; color: #555;
  cursor: pointer; width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px; font-size: 0.75rem; transition: all .15s;
}
.la-btn:hover     { border-color: #3a3a3a; color: #C6C7BD; }
.la-btn.del:hover { border-color: #F08080; color: #F08080; }

/* ── 等級列 ──────────────────────────────────────────────────────────────── */
.level-row {
  background: #0C0D0C; border: 1px solid #2a2a2a; border-radius: 6px;
  padding: 8px 10px; margin-bottom: 6px;
}
.level-row-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 5px; font-size: 0.7rem;
}
.level-num { color: #C8DD5A; font-weight: 700; }
.level-del-btn {
  background: transparent; border: none; color: #444;
  cursor: pointer; font-size: 0.82rem; transition: color .15s;
}
.level-del-btn:hover { color: #F08080; }

/* ── 句子小幫手 ──────────────────────────────────────────────────────────── */
.sent-helper {
  background: #0C0D0C; border: 1px solid #2a2a2a;
  border-radius: 5px; padding: 8px 10px; font-size: 0.72rem;
  color: #555; margin-top: 6px; line-height: 1.8;
}
.sent-helper-row { display: flex; align-items: baseline; gap: 8px; }
.sent-ph  { color: #C8DD5A; font-family: monospace; font-weight: 700; }
.sent-ico { color: #C6C7BD; }
.sent-lv1 { color: #555; font-style: italic; max-width: 200px; overflow: hidden;
             white-space: nowrap; text-overflow: ellipsis; }

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.ne-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border: none; border-radius: 5px;
  font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: opacity .2s;
}
.ne-btn:hover  { opacity: .85; }
.ne-btn-prime  { background: #40C99A; color: #0C0D0C; }
.ne-btn-spec   { background: #C8DD5A; color: #0C0D0C; }
.ne-btn-ghost  { background: transparent; border: 1px solid #2a2a2a; color: #95BDD7; }
.ne-btn-ghost:hover { border-color: #40C99A; color: #40C99A; opacity: 1; }
.ne-btn-sm { padding: 4px 10px; font-size: 0.75rem; }

/* ── 錯誤 ────────────────────────────────────────────────────────────────── */
.form-err {
  background: #2a0a0a; border: 1px solid #F08080;
  color: #F08080; border-radius: 5px; padding: 7px 11px;
  font-size: 0.78rem; margin-bottom: 10px; display: none;
}

/* ── Toggle ──────────────────────────────────────────────────────────────── */
.toggle-wrap { display: flex; align-items: center; gap: 10px; }
.toggle-switch {
  position: relative; display: inline-block; width: 36px; height: 20px;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; cursor: pointer; inset: 0;
  background: #2a2a2a; border-radius: 20px; transition: .2s;
}
.toggle-slider::before {
  content: ''; position: absolute; height: 14px; width: 14px;
  left: 3px; bottom: 3px; background: #555; border-radius: 50%; transition: .2s;
}
.toggle-switch input:checked + .toggle-slider { background: #40C99A; }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); background: #0C0D0C; }
.toggle-label { font-size: 0.78rem; color: #95BDD7; cursor: pointer; }
</style>
</head>

<header class="app-header">
  <span class="app-logo">🧩 Chunk Demo 編輯器</span>
  <span style="color:#2a2a2a;">|</span>
  <span class="app-note">Nelson English</span>

  <button class="btn-open"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#builderOffcanvas">
    <i class="bi bi-sliders"></i>
    <span id="open-btn-label">設定與新增語塊</span>

  <div class="header-tabs">

  </div>

<!-- ══════════════════════════════════════════════════════════════════════════
     Offcanvas
     ══════════════════════════════════════════════════════════════════════════ -->
<div class="offcanvas offcanvas-start" tabindex="-1"
     id="builderOffcanvas" aria-labelledby="builderOffcanvasLabel">
  <div class="offcanvas-header">
    <span class="offcanvas-title" id="builderOffcanvasLabel">⚙️ 設定與新增語塊</span>
    <button class="btn-close-ne" data-bs-dismiss="offcanvas">✕</button>
  </div>
  <div class="offcanvas-body">

    <!-- 句子設定 -->
    <div class="sec">

      <div class="fl">
        <label>句子（用 {0} {1} {2}… 標記語塊位置）</label>
        <textarea id="cfg-sentence" class="ne-in" rows="3"
                  placeholder="例：We had {0} on Netflix and finally had {1}."
                  oninput="onSentenceChange()"></textarea>
        <span class="hint-sm">數字對應下方語塊的 ID</span>
      </div>
      <div class="sent-helper" id="sent-helper">
        <span style="color:#2a2a2a;">加入語塊後，這裡會顯示可用的佔位符。</span>
      </div>
    </div>

    <!-- 元件設定 -->
    <div class="sec">
      <div class="sec-title">元件設定</div>

      <!-- 主題 -->
      <div class="fl" style="margin-bottom:14px;">
        <label>主題色</label>
        <div class="theme-grid" id="theme-grid"></div>
      </div>

      <!-- Show preview toggle -->
      <div class="fl" style="margin-bottom:10px;">

        <div class="toggle-wrap">

          </label>

            <option value="dotted">dotted</option>
            <option value="double">double</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 已加入語塊 -->

    <!-- 新增語塊 -->

      <div class="fl-row" style="margin-bottom:10px;">
        <div style="width:80px;">
          <label style="font-size:.75rem;color:#95BDD7;display:block;margin-bottom:5px;">圖示（選填）</label>
          <input id="form-icon" type="text" class="ne-in" placeholder="🎬" style="text-align:center;font-size:1.2rem;">

        <div style="flex:1;">

        </label>
        <button class="ne-btn ne-btn-ghost ne-btn-sm" onclick="addLevel()">

      </div>
      <div id="form-levels"></div>
      <div style="font-size:.68rem;color:#444;margin-bottom:10px;">
        <i class="bi bi-info-circle"></i> 文字內容可包含 HTML 標籤，如 <code>&lt;u&gt;</code>、<code>&lt;strong&gt;</code>
      </div>

      <button class="ne-btn ne-btn-prime" style="width:100%;" onclick="addChunk()">
        <i class="bi bi-plus-circle-fill"></i> 加入語塊

      點擊語塊按鈕可展開下拉選單，選擇不同等級——與實際嵌入效果完全相同

<script>
// ════════════════════════════════════════════════════════════════════════════
// 品牌主題色表（含更新後的 vanilla 和新增的 focus）
// ════════════════════════════════════════════════════════════════════════════
const THEMES = {
  special:  '#C8DD5A',
  safe:     '#40C99A',
  sky:      '#08A9D1',
  focus:    '#A0CF72',
  lavender: '#C3A5E5',
  indigo:   '#7B6CF0',
  pink:     '#FFB3D9',
  salmon:   '#E5C3B3',
  orange:   '#EDA109',
  yellow:   '#DECA4B',
  warning:  '#F08080',
  info:     '#4285EB',
  stone:    '#95BDD7',
  vanilla:  '#DBEDD8',
  shell:    '#C6C7BD',
};

// ════════════════════════════════════════════════════════════════════════════
// 狀態
// ════════════════════════════════════════════════════════════════════════════
const state = {
  sentence:    '',
  theme:       'special',
  showPreview: false,
  borderWidth: '',
  borderStyle: '',
  chunks:      [],
  nextId:      0,
};

const form = {
  levels: [{ text: '' }, { text: '' }],
};

// ════════════════════════════════════════════════════════════════════════════
// Escape
// ════════════════════════════════════════════════════════════════════════════
function escAttr(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;')
         .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════════════════════════
// 設定
// ════════════════════════════════════════════════════════════════════════════
function onSentenceChange() {
  state.sentence = document.getElementById('cfg-sentence').value;
  refreshOutput();
}

function onSettingChange() {
  state.showPreview = document.getElementById('cfg-showpreview').checked;
  state.borderWidth = document.getElementById('cfg-bwidth').value.trim();
  state.borderStyle = document.getElementById('cfg-bstyle').value;
  document.getElementById('showpreview-label').textContent = state.showPreview ? '開啟' : '關閉';
  refreshOutput();
}

function setTheme(name) {
  state.theme = name;
  document.querySelectorAll('.theme-sw').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.theme === name);
  });
  refreshOutput();
}

// ════════════════════════════════════════════════════════════════════════════
// 初始化主題選擇器
// ════════════════════════════════════════════════════════════════════════════
function initThemeGrid() {
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';
  Object.entries(THEMES).forEach(([name, color]) => {
    const btn = document.createElement('button');
    btn.className = 'theme-sw' + (name === state.theme ? ' active' : '');
    btn.dataset.theme = name;
    btn.style.setProperty('--tc', color);
    btn.textContent = name;
    btn.onclick = () => setTheme(name);
    grid.appendChild(btn);
  });
}

// ════════════════════════════════════════════════════════════════════════════
// 等級管理
// ════════════════════════════════════════════════════════════════════════════
function addLevel() {
  form.levels.push({ text: '' });
  renderLevels();
}

function removeLevel(idx) {
  if (form.levels.length <= 1) return;
  form.levels.splice(idx, 1);
  renderLevels();
}

function renderLevels() {
  const wrap = document.getElementById('form-levels');
  wrap.innerHTML = '';
  form.levels.forEach((lv, idx) => {
    const div = document.createElement('div');
    div.className = 'level-row';
    div.innerHTML = `
      <div class="level-row-head">
        <span class="level-num">Level ${idx + 1}</span>
        ${form.levels.length > 1
          ? `<button class="level-del-btn" onclick="removeLevel(${idx})" title="刪除此等級">
               <i class="bi bi-x"></i>
             </button>`
          : ''}
      </div>
      <textarea class="ne-in" rows="2"
                placeholder="${idx === 0
                  ? '完整語塊文字（英文片語或詳細說明）'
                  : idx === 1
                  ? '簡化說明或中文翻譯'
                  : '更簡化 / 單詞提示'}"
                oninput="form.levels[${idx}].text = this.value">${escAttr(lv.text)}</textarea>`;
    wrap.appendChild(div);
  });
}

// ════════════════════════════════════════════════════════════════════════════
// 語塊 CRUD
// ════════════════════════════════════════════════════════════════════════════
function addChunk() {
  clearErr();

  // 同步 textarea 值
  document.querySelectorAll('#form-levels textarea').forEach((ta, i) => {
    if (form.levels[i]) form.levels[i].text = ta.value;
  });

  if (form.levels.every(lv => !lv.text.trim())) {
    return showErr('至少需要填寫 Level 1 的文字。');
  }
  // 填空的等級仍保留（允許空等級供使用者後續補充），但至少一個有內容
  if (!form.levels[0].text.trim()) {
    return showErr('Level 1 文字不能為空。');
  }

  const icon  = document.getElementById('form-icon').value.trim();
  const label = document.getElementById('form-label').value.trim();

  state.chunks.push({
    id:     state.nextId++,
    icon,
    label,
    levels: form.levels.map((lv, i) => ({ level: i + 1, text: lv.text }))
              .filter(lv => lv.text.trim()),
  });

  // 重置表單
  document.getElementById('form-icon').value  = '';
  document.getElementById('form-label').value = '';
  form.levels = [{ text: '' }, { text: '' }];
  renderLevels();

  refreshOutput();
}

function removeChunk(idx) {
  state.chunks.splice(idx, 1);
  refreshOutput();
}

function moveChunk(idx, dir) {
  const to = idx + dir;
  if (to < 0 || to >= state.chunks.length) return;
  [state.chunks[idx], state.chunks[to]] = [state.chunks[to], state.chunks[idx]];
  refreshOutput();
}

// ════════════════════════════════════════════════════════════════════════════
// 語塊清單 + 句子小幫手
// ════════════════════════════════════════════════════════════════════════════
function renderChunkList() {
  const wrap  = document.getElementById('chunk-list');
  const count = state.chunks.length;
  document.getElementById('chunk-count').textContent = `(${count})`;
  document.getElementById('open-btn-label').textContent =
    count > 0 ? `設定與新增語塊（${count}）` : '設定與新增語塊';

  if (count === 0) {
    wrap.innerHTML = '<div style="color:#444;font-size:.8rem;text-align:center;padding:12px 0;">尚未加入任何語塊</div>';
    return;
  }

  wrap.innerHTML = '';
  state.chunks.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'chunk-item';
    const lv1 = ch.levels[0]?.text || '—';
    item.innerHTML = `
      <span class="chunk-id">{${ch.id}}</span>
      ${ch.icon ? `<span class="chunk-icon">${ch.icon}</span>` : ''}
      <span class="chunk-label" title="${escAttr(lv1)}">
        ${ch.label ? `<strong style="color:#C6C7BD;">${escAttr(ch.label)}</strong> · ` : ''}${escAttr(lv1.slice(0,24))}${lv1.length>24?'…':''}
      </span>
      <div class="chunk-actions">
        <button class="la-btn" onclick="moveChunk(${idx},-1)" title="上移"><i class="bi bi-arrow-up"></i></button>
        <button class="la-btn" onclick="moveChunk(${idx},1)"  title="下移"><i class="bi bi-arrow-down"></i></button>
        <button class="la-btn del" onclick="removeChunk(${idx})" title="刪除"><i class="bi bi-trash3"></i></button>
      </div>`;
    wrap.appendChild(item);
  });
}

function renderSentenceHelper() {
  const el = document.getElementById('sent-helper');
  if (state.chunks.length === 0) {
    el.innerHTML = '<span style="color:#2a2a2a;">加入語塊後，這裡會顯示可用的佔位符。</span>';
    return;
  }
  el.innerHTML = state.chunks.map(ch => {
    const lv1 = ch.levels[0]?.text || '';
    return `<div class="sent-helper-row">
      <span class="sent-ph">{${ch.id}}</span>
      ${ch.icon ? `<span class="sent-ico">${ch.icon}</span>` : ''}
      <span class="sent-lv1" title="${escAttr(lv1)}">${escAttr(lv1.slice(0,28))}${lv1.length>28?'…':''}</span>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// HTML 產生器
// ════════════════════════════════════════════════════════════════════════════
function generateHTML(pretty = true) {
  if (!state.sentence || state.chunks.length === 0) return '';

  const ind  = pretty ? '  ' : '';
  const nl   = pretty ? '\n' : '';

  let attrs = ` sentence="${escAttr(state.sentence)}"`;
  attrs += ` theme="${escAttr(state.theme)}"`;
  if (state.showPreview)  attrs += ` show-preview="true"`;
  if (state.borderWidth)  attrs += ` border-width="${escAttr(state.borderWidth)}"`;
  if (state.borderStyle)  attrs += ` border-style="${escAttr(state.borderStyle)}"`;

  let inner = '';
  state.chunks.forEach(ch => {
    inner += `${nl}${ind}<cd-chunk id="${ch.id}"`;
    if (ch.icon)  inner += ` icon="${escAttr(ch.icon)}"`;
    if (ch.label) inner += ` label="${escAttr(ch.label)}"`;
    inner += `>`;
    ch.levels.forEach(lv => {
      inner += `${nl}${ind}${ind}<cd-level level="${lv.level}">${lv.text}</cd-level>`;
    });
    inner += `${nl}${ind}</cd-chunk>`;
  });

  return `<chunk-demo${attrs}>${inner}${nl}</chunk-demo>`;
}

// ════════════════════════════════════════════════════════════════════════════
// 預覽
// ════════════════════════════════════════════════════════════════════════════
function updatePreview() {
  const area = document.getElementById('preview-area');
  if (!state.sentence || state.chunks.length === 0) {
    area.innerHTML = `<div class="preview-empty">
      <i class="bi bi-chat-quote" style="font-size:2.5rem;display:block;margin-bottom:12px;color:#1e1e1e;"></i>
      加入句子和語塊後，這裡會顯示即時預覽</div>`;
    return;
  }
  area.innerHTML = generateHTML(false);
}

// ════════════════════════════════════════════════════════════════════════════
// 程式碼
// ════════════════════════════════════════════════════════════════════════════
function updateCode() {
  document.getElementById('code-output').value =
    state.sentence && state.chunks.length > 0
      ? generateHTML(true)
      : '（請先加入句子和至少一個語塊）';
}

async function copyCode() {
  const text = document.getElementById('code-output').value;
  if (!text || text.startsWith('（')) return;
  try {
    await navigator.clipboard.writeText(text);
    const toast = document.getElementById('copy-toast');
    toast.style.display = 'inline';
    setTimeout(() => toast.style.display = 'none', 2000);
  } catch { document.getElementById('code-output').select(); }
}

// ════════════════════════════════════════════════════════════════════════════
// Tab
// ════════════════════════════════════════════════════════════════════════════
function showTab(name) {
  ['preview','code'].forEach(t => {
    document.getElementById('tab-' + t).style.display  = t === name ? '' : 'none';
    document.getElementById('tab-btn-' + t).classList.toggle('active', t === name);
  });
  if (name === 'preview') updatePreview();
  if (name === 'code')    updateCode();
}

// ════════════════════════════════════════════════════════════════════════════
// 錯誤
// ════════════════════════════════════════════════════════════════════════════
function showErr(msg) { const el = document.getElementById('form-err'); el.textContent = msg; el.style.display = 'block'; }
function clearErr()   { const el = document.getElementById('form-err'); el.style.display = 'none'; el.textContent = ''; }

// ════════════════════════════════════════════════════════════════════════════
// 統一更新
// ════════════════════════════════════════════════════════════════════════════
function refreshOutput() {
  renderChunkList();
  renderSentenceHelper();
  const isCode = document.getElementById('tab-code').style.display !== 'none';
  if (isCode) updateCode(); else updatePreview();
}

// ════════════════════════════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════════════════════════════
(function init() {
  initThemeGrid();
  renderLevels();
})();
</script>
</body>
</html>
